<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRANK // BODY COUNT</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#030504;color:#00ff66;font-family:Consolas,monospace;display:grid;place-items:center;overflow:hidden}body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,255,102,.035) 4px);pointer-events:none}.card{width:min(720px,92vw);padding:42px;border:1px solid #00ff66;background:rgba(0,12,5,.92);box-shadow:0 0 35px rgba(0,255,102,.2);text-align:center}.tag{font-size:12px;letter-spacing:3px;opacity:.7}.q{font-size:clamp(25px,5vw,52px);margin:20px 0 30px}.opts{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}button{min-width:180px;padding:16px 24px;border:1px solid #00ff66;background:#001b08;color:#00ff66;font:700 18px Consolas,monospace;cursor:pointer}button:hover{background:#004812;box-shadow:0 0 22px rgba(0,255,102,.35);transform:translateY(-2px)}#next{display:none;margin:28px auto 0}.hidden{display:none}.result{font-size:clamp(22px,4vw,40px);line-height:1.5}.small{opacity:.65;font-size:13px;margin-top:25px}
</style>
</head>
<body>
<main class="card" id="app">
<div class="tag">⚠ DARE MODE // PRANK SIMULATOR</div>
<section id="question">
<div class="q">YOUR BODY COUNT?</div>
<div class="opts"><button data-answer="0">0</button><button data-answer="5+">5+</button></div>
<p class="small">Choose one option to unlock the next question.</p>
</section>
<section id="nextScreen" class="hidden">
<div class="result">ANSWER RECORDED 😈</div>
<p>Ready for the next question?</p>
<button id="next">CLICK HERE FOR NEXT QUESTION</button>
</section>
</main>
<audio id="prankAudio" preload="auto"><source src="https://raw.githubusercontent.com/Cyber-knose/PRANK-SIMULATOR/main/TEST12.mp3" type="audio/mpeg"></audio>
<script>
const audio=document.getElementById('prankAudio'), question=document.getElementById('question'), nextScreen=document.getElementById('nextScreen'), next=document.getElementById('next');
document.querySelectorAll('[data-answer]').forEach(btn=>btn.addEventListener('click',()=>{question.classList.add('hidden');nextScreen.classList.remove('hidden');next.style.display='block';}));
next.addEventListener('click',async()=>{audio.currentTime=0;audio.volume=1;try{await audio.play()}catch(e){};next.textContent='🎵 PRANK AUDIO PLAYING...';next.disabled=true;setTimeout(()=>{nextScreen.querySelector('.result').textContent='😂 GOT YOU! THIS WAS A PRANK!';},900);});
</script>
</body>
</html>
